version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: my_notion_db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: my_notion
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: my_notion_db_admin
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  pgdata:
